name: 'ForgeVault CRA Readiness'
description: 'Cyber Resilience Act readiness checks for GitHub repositories.'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  sync:
    description: 'Opt-in: send the sanitized readiness summary to ForgeVault.'
    required: false
    default: 'false'
  token:
    description: 'ForgeVault action token. Used only when sync is true.'
    required: false
  endpoint:
    description: 'ForgeVault readiness ingestion endpoint. Override only for an approved deployment.'
    required: false
    default: 'https://rhxokpmfxnwtuxoqmalf.supabase.co/functions/v1/ingest-readiness'
  product:
    description: 'ForgeVault product identifier used for an opt-in sync.'
    required: false
  fail-on:
    description: 'Optional gate: none, error, gap, or unknown. Defaults to informational output.'
    required: false
    default: 'none'
outputs:
  detected-count:
    description: 'Number of checks with positively detected evidence.'
    value: ${{ steps.readiness.outputs['detected-count'] }}
  gap-count:
    description: 'Number of checks where evidence was not detected.'
    value: ${{ steps.readiness.outputs['gap-count'] }}
  unknown-count:
    description: 'Number of checks that could not be verified.'
    value: ${{ steps.readiness.outputs['unknown-count'] }}
  report-json:
    description: 'Compact JSON readiness report for later workflow steps.'
    value: ${{ steps.readiness.outputs['report-json'] }}
runs:
  using: 'composite'
  steps:
    - name: Run ForgeVault CRA Readiness
      id: readiness
      shell: bash
      env:
        FORGEVAULT_SYNC: ${{ inputs.sync }}
        FORGEVAULT_TOKEN: ${{ inputs.token }}
        FORGEVAULT_ENDPOINT: ${{ inputs.endpoint }}
        FORGEVAULT_PRODUCT: ${{ inputs.product }}
        FORGEVAULT_FAIL_ON: ${{ inputs['fail-on'] }}
        GH_TOKEN: ${{ github.token }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
